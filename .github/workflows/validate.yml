name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    name: JavaScript and static assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check syntax and local module exports
        run: node scripts/check-modules.mjs
      - name: Test button ripple geometry
        run: node scripts/test-button-ripple.mjs
      - name: Check helper scripts
        run: sh -n scripts/build-css.sh && sh -n scripts/release-notes.sh
      - name: Test Kinobox Pages Function proxy
        run: node scripts/test-kinobox-function.mjs
      - name: Test TMDb HTTP geo-block fallback
        run: node scripts/test-tmdb-fallback.mjs
      - name: Test main-tab state preservation
        run: node scripts/test-page-state.mjs
      - name: Verify release notes can be generated
        run: scripts/release-notes.sh v1.0.20 > /dev/null
      - name: Verify compiled Tailwind CSS
        run: |
          ./scripts/build-css.sh
          git diff --exit-code -- assets/tw.css
