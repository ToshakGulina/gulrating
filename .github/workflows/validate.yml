name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site:
    name: JavaScript and static assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check syntax and local module exports
        run: node scripts/check-modules.mjs
      - name: Test button ripple geometry
        run: node scripts/test-button-ripple.mjs
      - name: Check helper scripts
        run: sh -n scripts/build-css.sh && sh -n scripts/release-notes.sh
      - name: Test Kinobox Pages Function proxy
        run: node scripts/test-kinobox-function.mjs
      - name: Test TMDb HTTP geo-block fallback
        run: node scripts/test-tmdb-fallback.mjs
      - name: Test offline service-worker fallback
        run: node scripts/test-service-worker-offline.mjs
      - name: Test same-origin Supabase proxy
        run: node scripts/test-supabase-proxy.mjs
      - name: Test full-catalog update and resume
        run: node scripts/test-full-catalog-updates.mjs && node scripts/test-full-catalog-download-resume.mjs
      - name: Test franchise movie and TV tabs
        run: node scripts/test-franchise-tabs.mjs
      - name: Test movie runtime in title cards
        run: node scripts/test-title-runtime.mjs
      - name: Test main-tab state preservation
        run: node scripts/test-page-state.mjs
      - name: Test watch progress storage
        run: node scripts/test-watch-progress.mjs
      - name: Test Android progress tracking in embedded player frames
        run: node scripts/test-watch-progress-android.mjs
      - name: Test browser progress messages from cross-origin players
        run: node scripts/test-player-progress-messages.mjs
      - name: Test Alloha browser extension progress bridge
        run: node scripts/test-alloha-extension.mjs
      - name: Test offline watch actions and franchise notifications
        run: node scripts/test-watch-franchise-notifications.mjs
      - name: Test independent rating and status updates
        run: node scripts/test-title-statuses.mjs
      - name: Test profile status tabs
        run: node scripts/test-profile-status-tabs.mjs
      - name: Test Android APK updater wiring
        run: node scripts/test-apk-updater.mjs
      - name: Test per-member home-feed filter
        run: node scripts/test-feed-user-filter.mjs
      - name: Test friend rating label
        run: node scripts/test-friend-rating-label.mjs
      - name: Test small horizontal overflow fitting
        run: node scripts/test-horizontal-scroll-ui.mjs
      - name: Test Kinopoisk watchability and direct service links
        run: node scripts/test-kinopoisk-watchability.mjs
      - name: Verify release notes can be generated
        run: scripts/release-notes.sh v1.0.20 > /dev/null
      - name: Verify compiled Tailwind CSS
        run: |
          ./scripts/build-css.sh
          git diff --exit-code -- assets/tw.css
