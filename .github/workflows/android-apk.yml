name: android-apk

# Сборка APK для sideload. Ручной запуск создаёт артефакт Actions;
# тег v* дополнительно публикует APK в GitHub Releases.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'assets/**'
      - 'data/offline-catalog.json'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'tailwind.config.js'
      - 'scripts/build-css.sh'
      - 'scripts/release-notes.sh'
      - 'CHANGELOG.md'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed release APK
        run: cd android && gradle --no-daemon -q assembleRelease

      - name: Prepare release assets
        run: |
          mkdir -p release
          SAFE_REF="$(printf '%s' "$GITHUB_REF_NAME" | tr '/:' '--')"
          cp android/app/build/outputs/apk/release/app-release.apk "release/gulrating-${SAFE_REF}.apk"
          scripts/release-notes.sh "${GITHUB_REF_NAME}" > release/release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: gulrating-apk
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gulrating-apk
          path: release

      - name: Create release with APK and changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/gulrating-${GITHUB_REF_NAME}.apk#Подписанный APK для Android" \
            --title "ГульРейтинг APK ${GITHUB_REF_NAME}" \
            --notes-file release/release-notes.md \
            --repo "$GITHUB_REPOSITORY"
