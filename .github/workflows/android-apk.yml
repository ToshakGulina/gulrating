name: android-apk

# Сборка APK для установки вне Google Play (sideload).
# Ручной запуск: Actions → android-apk → Run workflow.
# Тег v*: дополнительно публикует APK в GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: cd android && gradle --no-daemon -q assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gulrating-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "ГульРейтинг APK ${GITHUB_REF_NAME}" \
            --notes "APK для установки вне Google Play: скачайте файл на телефон и откройте его (разрешите установку из неизвестных источников). При обновлении APK сначала удалите старую версию: сборка подписана отладочным ключом раннера." \
            --repo "$GITHUB_REPOSITORY"
