plugins {
    id 'com.android.application'
}

// Кладём веб-оболочку в APK, чтобы APK мог открыть последний собранный
// интерфейс даже при первом запуске без доступа к pages.dev.
def webAppSource = rootProject.projectDir.parentFile
def generatedWebAssets = file("$buildDir/generated/webAssets")
tasks.register('copyWebAppAssets', Copy) {
    from(webAppSource)
    include 'index.html', 'manifest.json', 'sw.js'
    include 'assets/**', 'vendor/**', 'src/**', 'icons/**', 'data/offline-catalog.json'
    into "$generatedWebAssets/web"
}

android {
    namespace 'dev.gulrating.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.gulrating.app'
        minSdk 24
        targetSdk 34
        versionCode 24
        versionName '1.0.24'
    }

    // Подпись подключается только при наличии всех переменных окружения.
    // В CI секреты выдаются только tag-релизу; PR собирается без подписи.
    def signingValues = [
        storeFile: System.getenv('ANDROID_KEYSTORE_FILE'),
        storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
        keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
    ]
    def hasAnySigningValue = signingValues.values().any { it }
    def hasCompleteSigning = signingValues.values().every { it }
    if (hasAnySigningValue && !hasCompleteSigning) {
        throw new GradleException('Для подписи задайте все ANDROID_KEYSTORE_* secrets.')
    }

    signingConfigs {
        if (hasCompleteSigning) {
            release {
                storeFile file(signingValues.storeFile)
                storePassword signingValues.storePassword
                keyAlias signingValues.keyAlias
                keyPassword signingValues.keyPassword
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            // Обёртка тонкая, минификация не нужна: меньше риск сломать WebView-логику
            minifyEnabled false
            if (hasCompleteSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main.assets.srcDir generatedWebAssets
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyWebAppAssets')
}

dependencies {
}
