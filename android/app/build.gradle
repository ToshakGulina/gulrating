plugins {
    id 'com.android.application'
}

// Кладём веб-оболочку в APK, чтобы APK мог открыть последний собранный
// интерфейс даже при первом запуске без доступа к pages.dev.
def webAppSource = rootProject.projectDir.parentFile
def generatedWebAssets = file("$buildDir/generated/webAssets")
tasks.register('copyWebAppAssets', Copy) {
    from(webAppSource)
    include 'index.html', 'manifest.json', 'sw.js'
    include 'assets/**', 'vendor/**', 'src/**', 'icons/**', 'data/offline-catalog.json'
    into "$generatedWebAssets/web"
}

android {
    namespace 'dev.gulrating.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.gulrating.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Стабильная подпись релизов: keystore лежит в приватном репозитории
    // (та же политика, что у ключей в src/config.js). Благодаря одному ключу
    // новые APK ставятся поверх старых без удаления.
    signingConfigs {
        release {
            storeFile file('../keystore/gulrating.p12')
            storePassword 'gulrating2026'
            keyAlias 'gulrating'
            keyPassword 'gulrating2026'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            // Обёртка тонкая, минификация не нужна: меньше риск сломать WebView-логику
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main.assets.srcDir generatedWebAssets
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyWebAppAssets')
}

dependencies {
}
