plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.gulrating.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.gulrating.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Обёртка тонкая, минификация не нужна: меньше риск сломать WebView-логику
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
