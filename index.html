<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ГульРейтинг</title>
  <meta name="description" content="ГульРейтинг: общие оценки фильмов и сериалов с друзьями — лента, комментарии, список «хочу посмотреть».">
  <meta name="theme-color" content="#120e0d">

  <!-- PWA: установка на главный экран -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ГульРейтинг">
  <script>
    // Если браузер выгрузил вкладку из памяти, восстановление не должно
    // переигрывать анимации входа поверх уже знакомого интерфейса.
    try {
      const navigation = performance.getEntriesByType('navigation')[0];
      if (document.wasDiscarded || (navigation && navigation.type === 'back_forward')) {
        document.documentElement.classList.add('skip-entry-motion');
      }
    } catch (_) {}
  </script>

  <!-- Tailwind собран в статический CSS (assets/tw.css): сайту не нужен
       внешний CDN, чтобы стартовать (CDN блокировался — приложение не
       загружалось вовсе). Пересборка: ./scripts/build-css.sh -->
  <link rel="stylesheet" href="/assets/tw.css">
  <style>
    :root { --p-rgb: 189 72 47; }
    html.skip-entry-motion *, html.skip-entry-motion *::before, html.skip-entry-motion *::after {
      animation: none !important;
      transition: none !important;
    }

    /* Тонкие скроллбары: горизонтальные ленты не выглядят тяжеловесно */
    * { scrollbar-width: thin; scrollbar-color: #62483f transparent; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: #62483f; border-radius: 999px; }

    /* Нижняя навигация не наезжает на домашний индикатор iPhone */
    nav.fixed { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }

    /* Установленное приложение (standalone): контент не залезает под статус-бар */
    @media all and (display-mode: standalone) {
      .safe-top { padding-top: calc(env(safe-area-inset-top) + 0.75rem); }
      #catalog-close-float { top: calc(env(safe-area-inset-top) + 8px); }
    }

    /* Карточки ленты: тонкая рамка и мягкий отклик вместо плоских плиток */
    #ratings-list .title-card { border: 1px solid rgb(51 65 85 / .45); transition: border-color .15s ease, background-color .15s ease; }
    #ratings-list .title-card:hover { border-color: rgb(71 85 105 / .8); }

    /* Размеры постеров задаём явно: одинаковый макет в браузере, PWA и APK. */
    .poster-frame { position: relative; aspect-ratio: 2 / 3; overflow: hidden; }
    .poster-frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .feed-card-poster { width: clamp(76px, 20vw, 112px); flex: 0 0 clamp(76px, 20vw, 112px); }
    .profile-card-poster { width: clamp(64px, 16vw, 80px); flex: 0 0 clamp(64px, 16vw, 80px); }
    #poster-box { width: clamp(104px, 28vw, 144px); flex: 0 0 clamp(104px, 28vw, 144px); }
    #poster-box > .poster-frame { width: 100%; aspect-ratio: 2 / 3; }
    .history-title { width: clamp(96px, 26vw, 128px); flex: 0 0 clamp(96px, 26vw, 128px); }
    .history-title > .poster-frame { width: 100%; aspect-ratio: 2 / 3; }
    .history-title .poster-frame { border-radius: 0.75rem; }
    .history-title > div:last-child { font-size: 11px; line-height: 1.25; }
    @media (min-width: 640px) {
      #poster-box { width: 144px; flex-basis: 144px; }
    }

    /* Заставка до загрузки JS — чтобы не было пустого белого экрана */
    #boot-splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #120e0d; color: #c7a99a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; z-index: 100;
    }
    #boot-splash .dot { animation: blink 1.2s infinite; }
    #boot-splash .dot:nth-child(2) { animation-delay: .2s; }
    #boot-splash .dot:nth-child(3) { animation-delay: .4s; }
    #boot-splash.splash-leaving { animation: splash-leave .2s ease-in forwards; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
    @keyframes splash-leave { to { opacity: 0; visibility: hidden; } }

    /* Живой фон: мягкие цветные свечения вместо плоского тёмного полотна */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(720px 440px at 10% -8%, rgba(226, 88, 59, .16), transparent 64%),
        radial-gradient(660px 520px at 90% 10%, rgba(242, 184, 102, .10), transparent 64%),
        radial-gradient(900px 640px at 50% 112%, rgba(122, 64, 53, .12), transparent 68%);
    }

    /* Лёгкая системная анимация интерфейса. Вступительные эффекты используют
       transform/opacity без скачков раскладки и безопасны для мобильных/PWA. */
    html { scroll-behavior: smooth; }
    #app:not(:empty) { animation: app-enter .32s cubic-bezier(.2,.75,.25,1); }
    #blocks-wrap > * { animation: section-enter .34s cubic-bezier(.2,.75,.25,1); }
    #blocks-wrap > :nth-child(2) { animation-delay: 45ms; }
    #blocks-wrap > :nth-child(3) { animation-delay: 90ms; }
    #blocks-wrap > :nth-child(2), #blocks-wrap > :nth-child(3) { animation-fill-mode: backwards; }
    #ratings-list.suppress-card-animation > .title-card,
    #trends-grid.suppress-card-animation > .rec-card { animation: none !important; }
    #ratings-list > .title-card:nth-child(2) { animation-delay: 25ms; }
    #ratings-list > .title-card:nth-child(3) { animation-delay: 50ms; }
    #ratings-list > .title-card:nth-child(4) { animation-delay: 75ms; }
    #ratings-list > .title-card:nth-child(5) { animation-delay: 100ms; }
    #ratings-list > .title-card:nth-child(6) { animation-delay: 125ms; }
    #ratings-list > .title-card:nth-child(n+7) { animation-delay: 150ms; }
    #ratings-list > .title-card:nth-child(n+2) { animation-fill-mode: backwards; }

    button:not(:disabled), a { transition: color .18s ease, background-color .18s ease, border-color .18s ease, box-shadow .18s ease, translate .18s ease, opacity .18s ease; }
    input, select, textarea { transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease; }
    @media (hover: hover) {
      button:not(:disabled):hover { translate: 0 -1px; }
      .title-card:hover, .rec-card:hover, .history-title:hover, .catalog-item:hover { translate: 0 -3px; }
      .title-card:hover, .catalog-item:hover { box-shadow: 0 14px 34px rgb(0 0 0 / .22); }
      .title-card:hover .poster-frame img, .catalog-item:hover .poster-frame img { transform: scale(1.045); }
      .rec-card:hover { filter: brightness(1.06); }
      .history-query:hover, .search-result-item:hover { translate: 3px 0; }
    }
    button:not(:disabled):active { translate: 0 1px; scale: .98; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgb(var(--p-rgb) / .8);
      outline-offset: 2px;
    }

    .title-card, .rec-card, .history-title, .history-query, .catalog-item, .search-result-item {
      transition: translate .2s cubic-bezier(.2,.75,.25,1), scale .2s ease, box-shadow .2s ease, border-color .2s ease, background-color .2s ease, filter .2s ease;
    }
    .poster-frame img { transition: transform .4s cubic-bezier(.2,.75,.25,1); }
    .group-average-badge { box-shadow: 0 5px 16px rgb(0 0 0 / .18), inset 0 1px rgb(255 255 255 / .14); }
    .watch-action-btn { box-shadow: 0 3px 12px rgb(var(--p-rgb) / .12); }
    .watch-action-btn:active { scale: .98; }
    .profile-section-switch { box-shadow: inset 0 1px rgb(255 255 255 / .04); }
    .profile-section-tab { transition: color .2s ease, background-color .2s ease, box-shadow .2s ease, translate .2s ease; }
    .profile-section-tab[aria-selected="true"] { box-shadow: 0 4px 14px rgb(var(--p-rgb) / .22); }
    .profile-section-tab:active { translate: 0 1px; }
    .profile-section-panel:not(.hidden) { animation: profile-panel-enter .24s cubic-bezier(.2,.75,.25,1); }
    .rating-modal-panel { animation: rating-modal-enter .24s cubic-bezier(.2,.75,.25,1); }
    .rating-modal-panel .poster-frame { border-radius: .75rem; }
    .friends-score-details { display: inline-block; max-width: 100%; }
    .friends-score-popover {
      position: absolute;
      top: calc(100% + .35rem);
      right: 0;
      z-index: 40;
      width: min(18rem, calc(100vw - 2rem));
      max-height: min(16rem, 45vh);
      overflow: auto;
      overscroll-behavior: contain;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity .14s ease, transform .14s ease, visibility .14s;
    }
    @media (hover: hover) {
      .friends-score-details:hover .friends-score-popover {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
      }
    }
    .friends-score-details:focus-within .friends-score-popover,
    .friends-score-details[data-open="true"] .friends-score-popover {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }
    .friends-ratings-details > summary { list-style: none; }
    .friends-ratings-details > summary::-webkit-details-marker { display: none; }
    .friends-ratings-details > summary::after { content: '+'; float: right; color: #94a3b8; }
    .friends-ratings-details[open] > summary::after { content: '−'; }
    .title-card, .rec-card, .history-title, .catalog-item { animation: card-enter .3s cubic-bezier(.2,.75,.25,1); }
    .search-result-item { animation: item-enter .22s ease-out; }
    #catalog-grid > .catalog-item { animation-fill-mode: backwards; }
    #trends-grid > .rec-card { animation-fill-mode: backwards; }
    #catalog-grid > .catalog-item:nth-child(2) { animation-delay: 25ms; }
    #catalog-grid > .catalog-item:nth-child(3) { animation-delay: 50ms; }
    #catalog-grid > .catalog-item:nth-child(4) { animation-delay: 75ms; }
    #catalog-grid > .catalog-item:nth-child(5) { animation-delay: 100ms; }
    #catalog-grid > .catalog-item:nth-child(6) { animation-delay: 125ms; }
    #catalog-grid > .catalog-item:nth-child(n+7) { animation-delay: 150ms; }
    #trends-grid > .rec-card:nth-child(2) { animation-delay: 25ms; }
    #trends-grid > .rec-card:nth-child(3) { animation-delay: 50ms; }
    #trends-grid > .rec-card:nth-child(4) { animation-delay: 75ms; }
    #trends-grid > .rec-card:nth-child(5) { animation-delay: 100ms; }
    #trends-grid > .rec-card:nth-child(6) { animation-delay: 125ms; }
    #trends-grid > .rec-card:nth-child(7) { animation-delay: 150ms; }
    #trends-grid > .rec-card:nth-child(8) { animation-delay: 175ms; }
    #trends-grid > .rec-card:nth-child(n+9) { animation-delay: 200ms; }

    .fixed.inset-0 { animation: overlay-enter .2s ease-out; }
    #search-results:not(.hidden) { animation: dropdown-enter .16s ease-out; transform-origin: top center; }
    nav.fixed { animation: nav-enter .3s cubic-bezier(.2,.75,.25,1); }
    #toast-container > * { animation: toast-enter .24s cubic-bezier(.2,.75,.25,1); }
    #toast-container > *.toast-leaving { animation: toast-leave .18s ease-in both; }

    @keyframes app-enter { from { opacity: 0; } to { opacity: 1; } }
    @keyframes section-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes card-enter { from { opacity: 0; transform: translateY(7px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes item-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes overlay-enter { from { opacity: 0; } to { opacity: 1; } }
    @keyframes dropdown-enter { from { opacity: 0; transform: translateY(-4px) scaleY(.98); } to { opacity: 1; transform: translateY(0) scaleY(1); } }
    @keyframes nav-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toast-enter { from { opacity: 0; transform: translateY(7px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toast-leave { to { opacity: 0; transform: translateY(5px); } }
    @keyframes profile-panel-enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rating-modal-enter { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* Уважаем системную настройку доступности «Уменьшить движение». */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* Слайдер оценки «как яркость на телефоне»: градиентная дорожка и крупный бегунок */
    .rating-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #ef4444 0%, #eab308 45%, #22c55e 75%);
      outline: none;
      cursor: pointer;
    }
    .rating-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid rgb(var(--p-rgb));
      box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
      cursor: grab;
    }
    .rating-slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.08); }
    .rating-slider::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid rgb(var(--p-rgb));
      box-shadow: 0 2px 8px rgba(0, 0, 0, .45);
      cursor: grab;
    }
    .rating-slider::-moz-range-track {
      height: 10px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #ef4444 0%, #eab308 45%, #22c55e 75%);
    }

    /* Новый арт-дирекшн: кинозал после титров — угольный фон, тёплая бумага,
       коралловый свет и медовые акценты. Цвета собраны в роли, а не по месту. */
    :root {
--p-rgb: 189 72 47;
      --ink: #f6eee7;
      --ink-muted: #c3b2a6;
      --ink-soft: #a28d82;
      --accent-text: color-mix(in srgb, rgb(var(--p-rgb)) 58%, var(--ink));
      --gold-text: #f2b866;
      --surface-base: #120e0d;
      --surface-inset: #171211;
      --surface-raised: #2a211e;
      --surface-hover: #3b2c28;
      --line-warm: #4b3934;
      --accent-glow: rgb(189 72 47 / .24);
      color-scheme: dark;
    }
    body { background: var(--surface-base); color: var(--ink); }
    h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
    #boot-splash { background: var(--surface-base); color: var(--ink-muted); }
    body::before {
      background:
        radial-gradient(760px 480px at 8% -8%, rgb(226 88 59 / .17), transparent 66%),
        radial-gradient(700px 520px at 94% 12%, rgb(242 184 102 / .10), transparent 66%),
        radial-gradient(1000px 700px at 50% 112%, rgb(124 66 54 / .12), transparent 68%);
    }
    * { scrollbar-color: #62483f transparent; }
    *::-webkit-scrollbar-thumb { background: #62483f; }

    /* Старые utility-классы переводятся на новую тёплую шкалу поверх Tailwind. */
    [class~="bg-slate-950"] { background-color: #0d0a09 !important; }
    [class~="bg-slate-900"] { background-color: var(--surface-inset) !important; }
    [class~="bg-slate-900/40"] { background-color: rgb(23 18 17 / .58) !important; }
    [class~="bg-slate-900/70"] { background-color: rgb(23 18 17 / .82) !important; }
    [class~="bg-slate-900/95"] { background-color: rgb(23 18 17 / .97) !important; }
    [class~="bg-slate-800"] { background-color: var(--surface-raised) !important; }
    [class~="bg-slate-800/40"] { background-color: rgb(42 33 30 / .54) !important; }
    [class~="bg-slate-800/50"] { background-color: rgb(42 33 30 / .64) !important; }
    [class~="bg-slate-800/60"] { background-color: rgb(42 33 30 / .72) !important; }
    [class~="bg-slate-800/70"] { background-color: rgb(42 33 30 / .78) !important; }
    [class~="bg-slate-800/80"] { background-color: rgb(42 33 30 / .88) !important; }
    [class~="bg-slate-700"] { background-color: var(--surface-hover) !important; }
    [class~="bg-slate-700/50"] { background-color: rgb(59 44 40 / .58) !important; }
    [class~="bg-slate-700/70"] { background-color: rgb(59 44 40 / .78) !important; }
    [class~="bg-slate-600"] { background-color: #59413a !important; }
    [class~="hover:bg-slate-700"]:hover { background-color: var(--surface-hover) !important; }
    [class~="hover:bg-slate-600"]:hover { background-color: #59413a !important; }
    [class~="border-slate-800"], [class~="border-slate-700"],
    [class~="border-slate-700/50"], [class~="border-slate-700/60"],
    [class~="border-slate-700/70"], [class~="border-slate-600"], [class~="border-slate-500"] { border-color: var(--line-warm) !important; }
    [class~="text-gray-100"] { color: var(--ink) !important; }
    [class~="text-gray-200"] { color: #eee2d8 !important; }
    [class~="text-gray-300"] { color: #ddcfc3 !important; }
    [class~="text-gray-400"] { color: var(--ink-muted) !important; }
    [class~="text-gray-500"] { color: var(--ink-soft) !important; }
    [class~="text-gray-600"] { color: #a28d82 !important; }
    [class~="text-gray-700"] { color: #9f887d !important; }
    [class~="text-primary"] { color: var(--accent-text); }
    [class~="text-secondary"] { color: var(--gold-text); }
    [class~="hover:text-primary"]:hover { color: var(--accent-text) !important; }
    [class~="hover:bg-primary/90"]:hover { background-color: #a93b28 !important; }
    [class~="focus-visible:outline-primary"]:focus-visible { outline-color: var(--gold-text) !important; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline-color: var(--gold-text);
    }

    .sticky.top-0.z-20 {
      background-color: rgb(18 14 13 / .92) !important;
      border-color: rgb(75 57 52 / .8) !important;
      box-shadow: 0 12px 32px rgb(0 0 0 / .18);
    }
    #ratings-list .title-card, #profile-content .title-card,
    #watch-history [data-key], #watched-history [data-key], .auth-panel {
      border: 1px solid rgb(196 151 127 / .18);
      border-radius: 1rem;
      background: linear-gradient(145deg, rgb(42 33 30 / .98), rgb(31 24 22 / .98));
      box-shadow: 0 8px 26px rgb(0 0 0 / .13);
    }
    #ratings-list .title-card:hover, #profile-content .title-card:hover,
    #watch-history [data-key]:hover, #watched-history [data-key]:hover {
      border-color: rgb(226 128 93 / .48);
      box-shadow: 0 12px 30px rgb(0 0 0 / .24), 0 0 0 1px rgb(189 72 47 / .08);
    }
    #search-input, input, select, textarea { caret-color: rgb(var(--p-rgb)); }
    input, select, textarea { border-color: var(--line-warm); }
    .rating-modal-panel { border: 1px solid rgb(196 151 127 / .22); box-shadow: 0 30px 90px rgb(0 0 0 / .55); }
    .group-average-badge { box-shadow: 0 6px 22px rgb(0 0 0 / .3), inset 0 1px rgb(255 255 255 / .16); }
    .profile-section-switch { background: rgb(23 18 17 / .78); border: 1px solid rgb(75 57 52 / .7); }
    .profile-section-tab[aria-selected="true"] { box-shadow: 0 5px 18px var(--accent-glow); }
    .friends-score-popover { border-color: var(--line-warm); background: #1b1513; }
    nav.fixed.bottom-0 {
      left: 50%; right: auto; width: min(calc(100% - 1.5rem), 48rem);
      transform: translateX(-50%);
      border: 1px solid rgb(196 151 127 / .22);
      border-bottom: 0;
      border-radius: 1.25rem 1.25rem 0 0;
      background: rgb(23 18 17 / .96) !important;
      box-shadow: 0 -12px 44px rgb(0 0 0 / .32);
    }
    @media (min-width: 1280px) {
      #app > .max-w-4xl { max-width: 80rem; }
    }
    .nav-btn { min-height: 3.75rem; }
    .nav-btn.text-primary { color: var(--accent-text); }
    .poster-frame { background-color: #342723; }
    .history-title .poster-frame, .catalog-item .poster-frame, .rec-card .poster-frame { box-shadow: 0 8px 20px rgb(0 0 0 / .24); }
    .brand-mark {
      display: grid; place-items: center; width: 3.5rem; height: 3.5rem;
      margin-inline: auto; border: 1px solid rgb(242 184 102 / .5); border-radius: 1.2rem;
      background: linear-gradient(145deg, #b9432b, #8f3124); color: #fff5eb;
      box-shadow: 0 12px 34px rgb(226 88 59 / .24), inset 0 1px rgb(255 255 255 / .22);
      font: 700 1.75rem Georgia, "Times New Roman", serif;
    }
    .section-kicker, .feed-kicker {
      color: #e4a777; font: 700 .65rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .16em; text-transform: uppercase;
    }
    @media (max-width: 640px) {
      h1, h2, h3 { letter-spacing: -.015em; }
      nav.fixed.bottom-0 { width: calc(100% - 1rem); }
    }
  </style>
</head>
<body class="bg-dark text-gray-100 font-sans min-h-screen">
  <div id="app"></div>
  <div id="boot-splash">Загружаем<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>

  <!-- Supabase вендорен локально (vendor/supabase.js): esm.sh больше не
       нужен на старте, глобал supabase даёт createClient -->
  <script src="/vendor/supabase.js"></script>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Регистрируем сервис-воркер для PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    // Если модули приложения не загрузились (нет интернета или провайдер
    // блокирует CDN Tailwind/esm.sh) — объясняем это вместо вечной заставки
    setTimeout(() => {
      const splash = document.getElementById('boot-splash');
      const app = document.getElementById('app');
      if (splash && app && !app.firstChild) {
        splash.innerHTML =
          'Не удалось загрузить модули приложения.<br>' +
          'Проверьте интернет и откройте снова: все файлы сайта локальные,<br>внешние CDN для старта больше не нужны.<br>' +
          '<button onclick="location.reload()" style="margin-top:12px;padding:8px 20px;border-radius:12px;background:#6366f1;color:#fff;border:0;font:inherit;cursor:pointer">Повторить</button>';
      }
    }, 12000);
  </script>
</body>
</html>
